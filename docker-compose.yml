services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medisync
      POSTGRES_PASSWORD: medisync_dev
      POSTGRES_DB: medisync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisync"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
