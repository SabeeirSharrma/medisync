# docker-compose.yml - MediSync self-hosted deployment
# Usage: docker compose -f docker-compose.yml up -d
# For production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medisync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medisync_dev}
      POSTGRES_DB: medisync
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisync -d medisync"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medisync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medisync_dev}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  # API service - runs migrations and starts Fastify server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://medisync:${POSTGRES_PASSWORD:-medisync_dev}@postgres:5432/medisync
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      COOKIE_SECURE: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      API_PORT: "3001"
      NODE_ENV: ${NODE_ENV:-production}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-medisync}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-medisync_dev}
      S3_BUCKET: medisync
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  # Web service - Next.js frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Next.js standalone server binds to $HOSTNAME; Docker auto-sets it to the
      # container ID, so force 0.0.0.0 to keep localhost reachable in-container
      HOSTNAME: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@medisync.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: unless-stopped

  # Optional: Cloudflare Tunnel — expose services without opening ports
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    profiles:
      - tunnel
    restart: unless-stopped

  # Optional: ngrok — quick dev tunnel for testing webhooks/sharing
  ngrok:
    image: ngrok/ngrok:latest
    command: start --config /etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./config/ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "4040:4040"
    profiles:
      - tunnel
    restart: unless-stopped

  # Optional: PostgreSQL backup service
  backup:
    image: prodrigestivill/postgres-backup-local:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: medisync
      POSTGRES_USER: medisync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medisync_dev}
      BACKUP_PATH: /backups
      SCHEDULE: "@daily"
      KEEP_DAYS: 30
    volumes:
      - backupdata:/backups
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - backup
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  pgadmindata:
  backupdata:

networks:
  default:
    name: medisync-network