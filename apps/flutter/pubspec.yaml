name: medisync
description: MediSync - Patient-controlled Electronic Health Records Flutter App
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0
  webview_flutter_wkwebview: ^3.11.0
  http: ^1.2.1
  shared_preferences: ^2.2.2
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.1.1
  url_launcher: ^6.2.5
  connectivity_plus: ^5.0.2
  permission_handler: ^11.3.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/